<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>상세검색 미리보기</title><style>
/* Sephiria 인게임 오버레이
   배경은 완전 투명해야 한다. 패널만 불투명하게 그리고, 나머지 영역은
   renderer 가 마우스 이벤트를 게임으로 통과시킨다. */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
  color: #dde3f0;
  font-size: 14px;
  /* 오버레이 전체에서 텍스트 선택 금지 (드래그 시 파랗게 반전되는 것 방지) */
  user-select: none;
  cursor: default;
}

.hidden { display: none !important; }

/* ── 공통 패널 ─────────────────────────────────────── */
.panel {
  position: absolute;
  background: rgba(15, 18, 28, 0.94);
  border: 1px solid #3b4663;
  border-radius: 10px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(2px);
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-bottom: 1px solid #2a3147;
  cursor: move;
}
.panel-head .title { font-weight: bold; font-size: 15px; color: #eaf0ff; }
.panel-head .hotkey {
  font-size: 11px; color: #59d0ff;
  border: 1px solid #2c5a75; border-radius: 4px;
  padding: 1px 6px; background: #132433;
}
.drag-hint { margin-left: auto; color: #4a5470; font-size: 11px; }

.empty { padding: 20px; text-align: center; color: #5a6685; font-size: 13px; }

/* ── ① 최적 배치 ───────────────────────────────────── */
#panel-optimizer { left: 24px; top: 104px; width: 404px; }

.opt-status { display: flex; align-items: center; gap: 10px; padding: 10px 14px 0; }

.status-badge {
  font-size: 12px; padding: 3px 10px; border-radius: 12px;
  display: inline-flex; align-items: center; gap: 6px;
}
.status-badge.idle    { background: #1a2032; color: #8b93ad; border: 1px solid #2a3147; }
.status-badge.done    { background: #12301f; color: #5fdc94; border: 1px solid #2b5c40; }
.status-badge.calc    { background: #33270f; color: #ffd75e; border: 1px solid #6b5624; }
.status-badge.error   { background: #331616; color: #ff8a8a; border: 1px solid #6b2b2b; }

.spinner {
  width: 11px; height: 11px;
  border: 2px solid #6b5624; border-top-color: #ffd75e;
  border-radius: 50%; animation: spin 0.9s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.calc-btn {
  margin-left: auto;
  background: #1d3a52; color: #8fdcff;
  border: 1px solid #2c5a75; border-radius: 6px;
  padding: 5px 12px; font-size: 13px; cursor: pointer;
  font-family: inherit;
}
.calc-btn:hover { background: #25496a; }
.calc-btn:disabled { opacity: 0.5; cursor: default; }

.prev-note { padding: 4px 14px 0; font-size: 11px; color: #a08c4a; }

.mini-grid-wrap { padding: 12px 14px 6px; }
.mini-grid { display: grid; gap: 3px; justify-content: center; }

.cell {
  background: #181d2c; border: 1px solid #262e45;
  border-radius: 5px; position: relative;
  width: 58px; height: 58px;
}
.cell.void { background: repeating-linear-gradient(45deg, #12151f, #12151f 4px, #171b28 4px, #171b28 8px); border-color: #1d2130; }
.cell.tablet { background: #20263c; border-color: #3d4966; }
.cell img {
  width: 100%; height: 100%; object-fit: contain;
  image-rendering: pixelated; padding: 5px;
}
.cell .lv {
  position: absolute; right: 2px; bottom: 1px;
  font-size: 12px; font-weight: bold; color: #ffd75e;
  text-shadow: 0 1px 2px #000, 0 0 4px #000;
}
.cell.inactive img { filter: grayscale(1) brightness(0.6); }
.cell.inactive::after {
  content: ''; position: absolute; inset: 0;
  border: 1px solid #6b2b2b; border-radius: 4px;
}

.grid-caption { text-align: center; color: #5a6685; font-size: 11px; padding: 4px 0 8px; }

.opt-section { padding: 8px 14px; border-top: 1px solid #232a40; }
.opt-section .sec-title { font-size: 12px; color: #8b93ad; margin-bottom: 7px; }
.sec-hint { color: #4a5470; }

.prio-list { min-height: 4px; }
.prio-row {
  display: flex; align-items: center; gap: 8px;
  background: #1a2032; border: 1px solid #2a3147;
  border-radius: 6px; padding: 5px 9px; margin-bottom: 5px;
  cursor: grab;
}
.prio-row.dragging { opacity: 0.4; }
.prio-row .handle { color: #4a5470; font-size: 14px; }
.prio-row .rank { color: #59d0ff; font-weight: bold; width: 16px; }
.prio-row img { width: 24px; height: 24px; image-rendering: pixelated; }
.prio-row .x { margin-left: auto; color: #4a5470; cursor: pointer; font-size: 13px; padding: 0 4px; }
.prio-row .x:hover { color: #ff8a8a; }

.add-combo {
  width: 100%; background: none; border: 1px dashed #3b4663;
  color: #5a6685; border-radius: 6px; padding: 5px;
  font-size: 12px; cursor: pointer; font-family: inherit;
}
.add-combo:hover { border-color: #3d5a80; color: #8b93ad; }

.combo-picker {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 4px; margin-top: 6px;
  max-height: 190px; overflow-y: auto;
}
.combo-opt {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: #1a2032; border: 1px solid #2a3147; border-radius: 6px;
  padding: 6px 2px; cursor: pointer; font-size: 11px; color: #a9b2c9;
}
.combo-opt:hover { border-color: #3d5a80; }
.combo-opt img { width: 24px; height: 24px; image-rendering: pixelated; }

.seg { display: flex; border: 1px solid #2c5a75; border-radius: 6px; overflow: hidden; }
.seg div {
  flex: 1; text-align: center; padding: 7px 0;
  font-size: 13px; color: #5a6685; cursor: pointer;
}
.seg div.on { background: #1d3a52; color: #8fdcff; font-weight: bold; }

/* ── ② 위키 빌드 ───────────────────────────────────── */
#panel-builds {
  right: 24px; top: 72px; width: 470px;
  /* 내용이 적으면 줄어들고, 길면 여기까지 커진 뒤 안에서 스크롤한다.
     고정 높이로 두면 빌드가 몇 개 없을 때 빈 패널이 커다랗게 남는다. */
  max-height: calc(100vh - 130px);
  display: flex; flex-direction: column;
}

/* 목록 화면만 flex 컬럼이다. 목록이 남는 공간을 다 먹어야 하기 때문. */
#build-list-view { display: flex; flex-direction: column; min-height: 0; flex: 1; }

/*
 * 상세 화면은 절대 flex 컨테이너로 두면 안 된다.
 * flex 자식은 기본적으로 줄어들 수 있어서, 내용이 길면 설명 박스가
 * 한 줄로 찌그러진다. 평범한 블록 + 스크롤이 맞다.
 */
#build-detail-view { display: block; min-height: 0; flex: 1; overflow-y: auto; }

.search-row { display: flex; gap: 8px; padding: 10px 14px 0; }
.search-row input {
  flex: 1; background: #181d2c; border: 1px solid #2a3147;
  border-radius: 6px; color: #dde3f0; padding: 7px 10px;
  font-size: 13px; font-family: inherit;
}
.filter-row { display: flex; gap: 8px; padding: 8px 14px; font-size: 12px; align-items: center; }
.filter-sel {
  background: #181d2c; border: 1px solid #2a3147; border-radius: 6px;
  color: #a9b2c9; padding: 5px 9px; cursor: pointer; font-family: inherit; font-size: 12px;
}
.filter-chk { color: #8b93ad; display: flex; gap: 4px; align-items: center; cursor: pointer; }

.build-list { flex: 1; overflow-y: auto; padding: 2px 14px 12px; }
.build-card {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  background: #1a2032; border: 1px solid #2a3147; border-radius: 8px;
  padding: 10px 12px 10px 10px; margin-bottom: 8px; cursor: pointer;
}
.build-card:hover { border-color: #3d5a80; }

/* 코스튬 / 무기 / 기적 아이콘. 텍스트만으로는 빌드가 구분되지 않는다. */
.bc-icons { display: flex; gap: 5px; flex-shrink: 0; }
.bc-icon {
  width: 40px; height: 40px; border-radius: 6px;
  background: #12151f; border: 1px solid #262e45;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.bc-icon img {
  max-width: 100%; max-height: 100%;
  object-fit: contain; image-rendering: pixelated;
}
.bc-icon.costume { background: #171c2b; }
.bc-icon.missing::after { content: '?'; color: #3d4966; font-size: 14px; }

.bc-body { min-width: 0; flex: 1; }
.bc-title {
  font-size: 13px; font-weight: bold; color: #eaf0ff; margin-bottom: 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; line-height: 1.35;
  /* 우상단 즐겨찾기 별과 겹치지 않도록 */
  padding-right: 20px;
}
.bc-meta { display: flex; gap: 8px; font-size: 11px; color: #8b93ad; align-items: center; flex-wrap: wrap; }
.bc-like { color: #ff7d9a; }
.bc-combos { display: flex; gap: 3px; margin-left: auto; }
.bc-combos img { width: 16px; height: 16px; image-rendering: pixelated; }

/* 즐겨찾기 별 */
.fav-btn {
  position: absolute; top: 4px; right: 6px;
  font-size: 15px; color: #4a5470; cursor: pointer; line-height: 1;
  padding: 2px 4px; border-radius: 4px;
}
.fav-btn:hover { color: #ffd75e; background: #232b42; }
.fav-btn.on { color: #ffd75e; }
.fav-btn.detail { position: static; font-size: 18px; margin-left: auto; }

/* 빌드 목록 탭 */
.build-tabs { display: flex; gap: 4px; padding: 10px 14px 0; }
.build-tab {
  padding: 5px 12px; font-size: 12px; color: #5a6685;
  background: #161b29; border: 1px solid #232a40;
  border-radius: 6px; cursor: pointer;
}
.build-tab.on { color: #8fdcff; background: #1d3a52; border-color: #2c5a75; font-weight: bold; }
.tab-count {
  background: #232b42; border-radius: 8px; padding: 0 5px;
  font-size: 10px; color: #a9b2c9; margin-left: 3px;
}

/* 상세 화면 헤더 */
.bd-head { display: flex; align-items: center; margin-bottom: 10px; }
.bd-head .back-btn { margin-bottom: 0; }
.bd-icons { display: flex; gap: 8px; margin-bottom: 12px; }
.bd-icon {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  width: 64px;
}
.bd-icon img {
  width: 48px; height: 48px; object-fit: contain; image-rendering: pixelated;
  background: #12151f; border: 1px solid #262e45; border-radius: 6px; padding: 3px;
}
.bd-icon em {
  font-style: normal; font-size: 10px; color: #8b93ad;
  text-align: center; line-height: 1.2;
}
.bd-icon.missing img { display: none; }

.build-detail { padding: 10px 14px; }
.back-btn {
  background: none; border: 1px solid #2a3147; color: #8b93ad;
  border-radius: 6px; padding: 4px 10px; font-size: 12px;
  cursor: pointer; margin-bottom: 10px; font-family: inherit;
}
.back-btn:hover { border-color: #3d5a80; color: #dde3f0; }
.bd-title { font-size: 16px; font-weight: bold; color: #eaf0ff; }
.bd-writer { font-size: 12px; color: #8b93ad; margin: 4px 0 10px; }
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { background: #232b42; border-radius: 5px; padding: 4px 9px; font-size: 12px; color: #a9b2c9; }
.chip b { color: #dde3f0; }
.combo-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.combo-badge {
  display: flex; align-items: center; gap: 6px;
  background: #1d3a52; border: 1px solid #2c5a75;
  border-radius: 6px; padding: 4px 10px; font-size: 13px; color: #8fdcff;
}
.combo-badge img { width: 22px; height: 22px; image-rendering: pixelated; }
.stat-row { display: flex; gap: 5px; margin-bottom: 12px; }
.stat-box {
  flex: 1; background: #181d2c; border: 1px solid #262e45;
  border-radius: 6px; text-align: center; padding: 6px 0;
}
.stat-box .sn { font-size: 10px; color: #5a6685; }
.stat-box .sv { font-size: 15px; font-weight: bold; color: #ffd75e; }
.stat-box .sv.zero { color: #3d4966; }
.bd-desc {
  background: #161b29; border: 1px solid #232a40; border-radius: 8px;
  padding: 10px 12px; font-size: 13px; line-height: 1.7; color: #b8c0d6;
  /* 최소 높이를 확보해야 읽을 수 있다. 길면 자체 스크롤. */
  min-height: 160px; max-height: 45vh; overflow-y: auto;
  margin-bottom: 12px;
}
.bd-desc p { margin: 0 0 6px; }
/* 위키 본문은 빈 <p></p> 로 빈 줄을 만든다 — 웹과 같은 간격으로 */
.bd-desc p:empty { min-height: 1.2em; }
.bd-desc ul { margin: 0 0 6px 16px; }
.item-section { margin-bottom: 12px; }
.item-section .is-label { font-size: 13px; font-weight: bold; color: #dde3f0; margin-bottom: 6px; }
.icon-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }
.icon-row .it {
  width: 44px; height: 44px; background: #181d2c;
  border: 1px solid #262e45; border-radius: 5px; padding: 4px;
}
.icon-row .it img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.icon-row .it.owned { border-color: #2b5c40; background: #12301f; }
.is-desc {
  font-size: 12px; color: #7d869e; line-height: 1.6;
  /* API 가 주는 섹션 설명은 \n 이 든 일반 텍스트다 — 웹처럼 줄바꿈 유지 */
  white-space: pre-line;
}

/* ── ③ 팀원 ────────────────────────────────────────── */
#panel-team { left: 24px; bottom: 70px; width: 404px; }
.team-tabs { display: flex; gap: 4px; padding: 8px 14px 0; flex-wrap: wrap; }
.team-tab {
  padding: 5px 14px; font-size: 13px; color: #5a6685;
  background: #161b29; border: 1px solid #232a40;
  border-radius: 6px 6px 0 0; cursor: pointer;
}
.team-tab.on { color: #8fdcff; background: #1d3a52; border-color: #2c5a75; font-weight: bold; }
.team-body { padding: 10px 14px 12px; }
.team-body .cell { width: 44px; height: 44px; }
.team-body .cell .lv { font-size: 10px; }
.team-body .cell img { padding: 3px; }

/* ── 상태 / 단축키 바 ──────────────────────────────── */
.ws-status {
  position: absolute; right: 24px; top: 20px;
  font-size: 13px; border-radius: 14px; padding: 5px 14px;
  background: rgba(15, 18, 28, 0.88);
  display: flex; align-items: center; gap: 7px;
}
.ws-status .dot { width: 8px; height: 8px; border-radius: 50%; }
.ws-status.connected    { color: #5fdc94; border: 1px solid #2b5c40; }
.ws-status.connected .dot    { background: #5fdc94; }
.ws-status.disconnected { color: #ff8a8a; border: 1px solid #6b2b2b; }
.ws-status.disconnected .dot { background: #ff8a8a; }

.hotkey-bar {
  position: absolute; bottom: 16px; left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 18, 28, 0.88);
  border: 1px solid #2a3147; border-radius: 16px;
  padding: 7px 18px; font-size: 12px; color: #8b93ad;
  display: flex; gap: 16px;
}
.hotkey-bar b { color: #8fdcff; font-weight: normal; }

/* 스크롤바 */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3147; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #3d4966; }

/* 새로고침처럼 부차적인 버튼 */
.calc-btn.ghost {
  margin-left: auto;
  background: transparent;
  color: #8b93ad;
  border-color: #2a3147;
}
.calc-btn.ghost:hover { background: #1a2032; color: #dde3f0; }
/* 새로고침이 margin-left:auto 를 가져갔으므로 계산 버튼은 붙여 놓는다 */
.calc-btn.ghost + .calc-btn { margin-left: 0; }

/* 팀원 패널의 격자는 최적배치보다 작게 */
#panel-team .mini-grid { gap: 2px; }
#panel-team .cell { width: 44px; height: 44px; }
#panel-team .cell .lv { font-size: 10px; }
#panel-team .cell img { padding: 3px; }
.team-meta { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }

/* ── 상세 헤더 아이콘 (코스튬 / 무기 / 기적) ────────────── */
.bd-icons { display: flex; gap: 10px; margin-bottom: 12px; }
.bd-icon {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  flex: 1; min-width: 0;
  background: #161b29; border: 1px solid #232a40; border-radius: 8px;
  padding: 8px 4px;
}
.bd-icon img {
  width: 44px; height: 44px; object-fit: contain; image-rendering: pixelated;
}
.bd-icon em {
  font-style: normal; font-size: 11px; color: #dde3f0;
  text-align: center; line-height: 1.25;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 100%;
}
.bd-icon small { font-size: 10px; color: #5a6685; }
.bd-icon.missing img { display: none; }

/* ── 과일꼬치 ───────────────────────────────────────────── */
.skewer-row {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  background: #161b29; border: 1px solid #232a40; border-radius: 8px;
  padding: 7px 10px; margin-bottom: 12px;
}
.skewer-label { font-size: 12px; color: #8b93ad; margin-right: 2px; }
.skewer-item {
  display: inline-flex; align-items: center; gap: 4px;
  background: #232b42; border-radius: 5px; padding: 3px 8px;
  font-size: 12px; color: #a9b2c9;
}
.skewer-item img { width: 16px; height: 16px; image-rendering: pixelated; }
.skewer-item b { color: #ffd75e; font-weight: bold; }

/* ── 아티팩트 호버 툴팁 ─────────────────────────────────── */
.artifact-tooltip {
  position: fixed; z-index: 9999; width: 300px;
  background: rgba(12, 15, 24, 0.98);
  border: 1px solid #3d5a80; border-radius: 8px;
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.7);
  padding: 10px 12px; pointer-events: none;
  font-size: 12px; line-height: 1.6;
}
.artifact-tooltip.hidden { display: none; }

.tt-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.tt-icon {
  width: 44px; height: 44px; object-fit: contain; image-rendering: pixelated;
  background: #181d2c; border: 1px solid #262e45; border-radius: 6px; padding: 3px;
  flex-shrink: 0;
}
.tt-name { font-size: 14px; font-weight: bold; color: #eaf0ff; }
.tt-sub { font-size: 11px; color: #8b93ad; }
.tt-owned { color: #5fdc94; }

.tt-combos { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.tt-combo {
  display: inline-flex; align-items: center; gap: 4px;
  background: #1d3a52; border: 1px solid #2c5a75; border-radius: 5px;
  padding: 2px 7px; font-size: 11px; color: #8fdcff;
}
.tt-combo img { width: 15px; height: 15px; image-rendering: pixelated; }

.tt-effect {
  color: #dde3f0; background: #161b29;
  border-left: 2px solid #3d5a80; border-radius: 4px;
  padding: 7px 9px; margin-bottom: 6px;
}
.tt-flavor {
  color: #6f7891; font-size: 11px; font-style: italic;
  white-space: pre-line;
}


/* ── 빌드 목록 페이저 ───────────────────────────────────── */
.build-pager {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 8px 14px 12px; border-top: 1px solid #232a40;
}
.pager-btn {
  background: #1a2032; color: #a9b2c9;
  border: 1px solid #2a3147; border-radius: 6px;
  padding: 5px 14px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.pager-btn:hover:not(:disabled) { border-color: #3d5a80; color: #dde3f0; }
.pager-btn:disabled { opacity: 0.35; cursor: default; }
.pager-info { font-size: 12px; color: #8b93ad; min-width: 60px; text-align: center; }

/* ── 상세검색 패널 ─────────────────────────────────────── */
.adv-open-btn {
  background: #1d3a52; color: #8fdcff;
  border: 1px solid #2c5a75; border-radius: 6px;
  padding: 5px 12px; font-size: 12px; cursor: pointer; font-family: inherit;
}
.adv-open-btn:hover { background: #25496a; }

.adv-search {
  /* 목록 영역 전체를 덮는다 */
  position: absolute; inset: 0; z-index: 10;
  background: rgba(12, 15, 24, 0.99);
  border-radius: 10px;
  overflow-y: auto; padding: 14px 16px;
}
#build-list-view { position: relative; }

.adv-head { display: flex; align-items: center; }
.adv-title { font-size: 16px; font-weight: bold; color: #eaf0ff; }
.adv-close {
  margin-left: auto; color: #5a6685; cursor: pointer;
  font-size: 14px; padding: 2px 6px; border-radius: 4px;
}
.adv-close:hover { color: #ff8a8a; background: #1a2032; }
.adv-sub { font-size: 12px; color: #8b93ad; margin: 4px 0 14px; }

.adv-field { margin-bottom: 12px; }
.adv-field > label {
  display: block; font-size: 13px; font-weight: bold;
  color: #dde3f0; margin-bottom: 6px;
}
.adv-text-row { display: flex; gap: 8px; }
.adv-text-row input {
  flex: 1; background: #181d2c; border: 1px solid #2a3147;
  border-radius: 6px; color: #dde3f0; padding: 7px 10px;
  font-size: 13px; font-family: inherit;
}

.picker-btn {
  display: flex; align-items: center; gap: 8px;
  background: #181d2c; border: 1px solid #2a3147; border-radius: 6px;
  padding: 8px 10px; font-size: 13px; color: #5a6685; cursor: pointer;
}
.picker-btn:hover { border-color: #3d5a80; }
.picker-btn.picked { color: #dde3f0; }
.picker-btn img { width: 24px; height: 24px; object-fit: contain; image-rendering: pixelated; }

.picker-pop {
  margin-top: 6px; background: #12151f;
  border: 1px solid #2a3147; border-radius: 8px; padding: 8px;
}
.picker-filter {
  width: 100%; background: #181d2c; border: 1px solid #2a3147;
  border-radius: 6px; color: #dde3f0; padding: 6px 9px;
  font-size: 12px; font-family: inherit; margin-bottom: 8px;
}
.picker-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 4px; max-height: 220px; overflow-y: auto;
}
.picker-opt {
  display: flex; align-items: center; gap: 6px;
  background: #1a2032; border: 1px solid #2a3147; border-radius: 6px;
  padding: 5px 7px; cursor: pointer; font-size: 11px; color: #a9b2c9;
  overflow: hidden;
}
.picker-opt:hover { border-color: #3d5a80; color: #dde3f0; }
.picker-opt img { width: 22px; height: 22px; object-fit: contain; image-rendering: pixelated; flex-shrink: 0; }
.picker-opt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.picker-opt.clear { grid-column: 1 / -1; justify-content: center; color: #8b93ad; }

.adv-actions { display: flex; gap: 8px; margin-top: 16px; }
.adv-actions .calc-btn { flex: 1; margin-left: 0; }

/* ── 적용 중 필터 칩 ───────────────────────────────────── */
.active-filters {
  display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 8px;
}
.filter-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: #1d3a52; border: 1px solid #2c5a75; border-radius: 12px;
  padding: 3px 10px; font-size: 12px; color: #8fdcff;
}
.filter-chip img { width: 16px; height: 16px; object-fit: contain; image-rendering: pixelated; }
.filter-chip .chip-x { cursor: pointer; color: #5a8db0; font-weight: normal; margin-left: 2px; }
.filter-chip .chip-x:hover { color: #ff8a8a; }

body { background:#0a0c12; margin:0; padding:24px; display:flex; gap:24px; align-items:flex-start; }
.wrap { width:470px; background:rgba(15,18,28,0.94); border:1px solid #3b4663; border-radius:10px; position:relative; height:760px; overflow:hidden; }
